<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080" />
  <title>Рассадка</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      font-family: 'Montserrat', 'Segoe UI', Arial, sans-serif;
    }

    #card {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
    }

    #card-bg {
      position: absolute;
      inset: 0;
      width: 1080px;
      height: 1920px;
      object-fit: cover;
      object-position: center;
      z-index: 0;
    }

    #card-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.60);
      z-index: 1;
    }

    /* ══ Общий layout ══ */
    #card-content {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
    }

    /* ══ ШАПКА ══ */
    .header-zone {
      flex-shrink: 0;
      padding: 70px 80px 0;
    }

    .evening-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 96px;
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      line-height: 1;
      text-shadow: 0 2px 20px rgba(0,0,0,0.8);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sub-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-top: 4px;
    }

    .game-label {
      font-family: 'Montserrat', sans-serif;
      font-size: 38px;
      font-weight: 400;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      line-height: 1;
    }

    .game-fraction {
      font-family: 'Montserrat', sans-serif;
      font-size: 130px;
      font-weight: 900;
      color: #e8b84b;
      line-height: 1;
      letter-spacing: -4px;
      text-shadow: 0 4px 30px rgba(232,184,75,0.4);
    }

    .divider {
      width: calc(100% - 160px);
      margin: 20px 80px 0;
      height: 2px;
      background: linear-gradient(
        90deg,
        #e8b84b 0%,
        rgba(232,184,75,0.15) 100%
      );
      flex-shrink: 0;
    }

    /* ══ ЦЕНТРАЛЬНАЯ ЗОНА ══ */
   .center-zone {
  flex: 1;
  display: flex;
  align-items: center;
  padding: 50px 80px 0;     /* было padding: 0 80px → добавил 50px сверху */
}

    #tplPlayersList {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 11px;          /* было 12px → 12 × 0.9 = 10.8 ≈ 11px */
}

.player-row {
  display: flex;
  align-items: center;
  gap: 26px;
  padding: 16px 34px;
  background: transparent;           /* было rgba(0,0,0,0.40) */
  border: none;                      /* было 1px solid rgba(232,184,75,0.18) */
  border-radius: 10px;
  backdrop-filter: none;             /* было blur(4px) */
}

    .player-num {
      width: 52px;
      height: 52px;
      background: #e8b84b;
      color: #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Montserrat', sans-serif;
      font-size: 24px;
      font-weight: 900;
      flex-shrink: 0;
    }

    .player-sep {
      width: 2px;
      height: 32px;
      background: rgba(232,184,75,0.3);
      flex-shrink: 0;
    }

    .player-name {
  font-family: 'Montserrat', sans-serif;
  font-size: 37px;          /* было 44px → 44 × 0.85 = 37.4 ≈ 37px */
  font-weight: 700;
  color: #f0f0f0;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  flex: 1;
  text-shadow: 0 1px 8px rgba(0,0,0,0.6);
}

    /* ══ ПОДВАЛ ══ */
    .footer-zone {
      flex-shrink: 0;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 80px 40px;
    }

    .logo {
      width: 160px;
      height: 160px;
      object-fit: contain;
      opacity: 0.9;
    }
  </style>
</head>
<body>
<div id="card">

  <img id="card-bg" src="images/seating-bg.jpg" alt="" />
  <div id="card-overlay"></div>

  <div id="card-content">

    <!-- ШАПКА -->
    <div class="header-zone">
      <div class="evening-title" id="tplEveningTitle">ШЕФСКИЙ</div>
      <div class="sub-row">
        <div class="game-label">РАССАДКА</div>
        <div class="game-fraction" id="tplGameTitle">1/4</div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- СПИСОК — центрируется вертикально -->
    <div class="center-zone">
      <div id="tplPlayersList">

        <div class="player-row">
          <div class="player-num">1</div>
          <div class="player-sep"></div>
          <div class="player-name">Ведьма</div>
        </div>

        <div class="player-row">
          <div class="player-num">2</div>
          <div class="player-sep"></div>
          <div class="player-name">Гибил</div>
        </div>

        <div class="player-row">
          <div class="player-num">3</div>
          <div class="player-sep"></div>
          <div class="player-name">Тур дэ Франс</div>
        </div>

        <div class="player-row">
          <div class="player-num">4</div>
          <div class="player-sep"></div>
          <div class="player-name">Леди Ди</div>
        </div>

        <div class="player-row">
          <div class="player-num">5</div>
          <div class="player-sep"></div>
          <div class="player-name">Мыслитель</div>
        </div>

        <div class="player-row">
          <div class="player-num">6</div>
          <div class="player-sep"></div>
          <div class="player-name">Борис</div>
        </div>

        <div class="player-row">
          <div class="player-num">7</div>
          <div class="player-sep"></div>
          <div class="player-name">Маяковская</div>
        </div>

        <div class="player-row">
          <div class="player-num">8</div>
          <div class="player-sep"></div>
          <div class="player-name">Арина Адвокат</div>
        </div>

        <div class="player-row">
          <div class="player-num">9</div>
          <div class="player-sep"></div>
          <div class="player-name">Папкина</div>
        </div>

      </div>
    </div>

    <!-- ПОДВАЛ -->
    <div class="footer-zone">
      <img class="logo" src="images/logo.png" alt="Революция" />
    </div>

  </div>
</div>
</body>
</html>
